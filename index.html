<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthony's Budget</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2f6f4f">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--line:#e4e2db;--acc:#2f6f4f;--warn:#b5532a;--soft:#e9f2ec}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--ink:#efede7;--mut:#a09e97;--line:#34332f;--acc:#6fbf94;--warn:#e08a5f;--soft:#24342b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.hero{background:var(--acc);color:#fff;border:0;text-align:center}.hero .big{font-size:40px;font-weight:700;line-height:1.1}.hero p{margin:4px 0;opacity:.9}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}.row>*{flex:1;min-width:120px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:var(--acc);color:#fff;cursor:pointer;font-weight:600}
button.x{background:transparent;color:var(--mut);padding:4px 8px;font-weight:400}
.list>div{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);gap:8px}.list>div:first-child{border-top:0}
.mut{color:var(--mut);font-size:13px}.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{color:var(--warn);font-weight:600}
.fc>div{padding:10px 0;border-top:1px solid var(--line)}.fc>div:first-child{border-top:0}
.fc .top{display:flex;justify-content:space-between;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;padding:10px 4px}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center}#toast button{padding:6px 12px}
.hide{display:none!important}
#explain p{margin:6px 0}#explain .ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}#explain .ln:first-of-type{border-top:0}#explain .left{font-size:20px;font-weight:700;color:var(--acc);margin-top:8px}
.bigbtn{font-size:18px;padding:16px 10px}
button.cancel{background:transparent;color:var(--mut);border:1px solid var(--line)}
button:active{opacity:.8}
</style>
</head>
<body>
<div class="wrap">
<h1>Anthony's Budget</h1>

<div class="card hero">
  <p>Set aside from each check</p>
  <div class="big" id="perCheck">$0</div>
  <p id="heroSub">Add your paychecks and bills to get started.</p>
</div>

<div class="card" id="explain"></div>

<div class="row">
  <button class="bigbtn" onclick="openForm('pForm')">+ Add paycheck</button>
  <button class="bigbtn" onclick="openForm('bForm')">+ Add bill</button>
</div>

<div class="card hide" id="pForm">
  <h2>Add a paycheck</h2>
  <label>How much did you take home?</label><input id="pAmt" type="number" inputmode="decimal" placeholder="$0">
  <label style="margin-top:8px">Date paid</label><input id="pDate" type="date">
  <div class="row" style="margin-top:10px"><button id="pAdd">Save paycheck</button><button class="cancel" onclick="closeForms()">Cancel</button></div>
</div>

<div class="card hide" id="bForm">
  <h2>Add a bill</h2>
  <label>What is it?</label><input id="bName" placeholder="Rent, phone, car insurance…">
  <label style="margin-top:8px">How much?</label><input id="bAmt" type="number" inputmode="decimal" placeholder="$0">
  <label style="margin-top:8px">When is it due next?</label><input id="bDue" type="date">
  <label style="margin-top:8px">How often?</label><select id="bFreq">
    <option value="monthly">Every month</option><option value="weekly">Every week</option><option value="biweekly">Every 2 weeks</option>
    <option value="yearly">Once a year</option><option value="once">Just once</option></select>
  <div class="row" style="margin-top:10px"><button id="bAdd">Save bill</button><button class="cancel" onclick="closeForms()">Cancel</button></div>
</div>

<div class="card"><h2>Coming up</h2><div class="fc" id="fc"></div></div>

<div class="card"><h2>My bills</h2><div class="list" id="bList"></div></div>

<div class="card"><h2>My paychecks</h2><div class="list" id="pList"></div>
  <div class="row" style="margin-top:10px">
    <div><label>I get paid</label><select id="freq"><option value="7">Every week</option><option value="14">Every 2 weeks</option><option value="15">Twice a month</option><option value="30">Monthly</option></select></div>
    <div><label>Next payday</label><input id="nextPay" type="date"></div>
  </div>
  <p class="mut" id="payNote"></p>
</div>

<div class="card"><h2>Backup</h2><p class="mut">Everything saves on this phone automatically. Copy a backup once in a while in case you lose your phone.</p>
  <div class="row"><button id="bkCopy">Copy backup</button><button id="bkRest" class="cancel">Restore</button></div><div id="bkArea"></div></div>
</div>

<div id="toast" class="hide"></div>
<script>
const $=id=>document.getElementById(id);
const LS="anthony-budget-simple";
const money=n=>"$"+Math.round(n).toLocaleString();
const iso=d=>d.toISOString().slice(0,10);
const D=s=>new Date(s+"T12:00:00");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>{const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x};
const fmt=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const t=new Date();t.setHours(12,0,0,0);return t};

let S={checks:[],bills:[],freq:14,nextPay:null};
try{const l=JSON.parse(localStorage.getItem(LS)||"null");if(l)S={...S,...l}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}

// ---- paychecks ----
function typical(){
  const c=[...S.checks].sort((a,b)=>a.date<b.date?1:-1).slice(0,6);
  if(!c.length)return 0;let w=0,s=0;c.forEach((x,i)=>{const k=c.length-i;w+=k;s+=x.amt*k});return s/w;
}
function lowCheck(){const c=[...S.checks].sort((a,b)=>a.date<b.date?1:-1).slice(0,8).map(x=>x.amt).sort((a,b)=>a-b);return c.length?c[0]:0}
function nextPayday(){
  if(S.nextPay&&D(S.nextPay)>=today())return D(S.nextPay);
  const last=[...S.checks].sort((a,b)=>a.date<b.date?1:-1)[0];
  let d=S.nextPay?D(S.nextPay):last?D(last.date):today();
  while(d<today())d=stepPay(d);
  return d;
}
function stepPay(d){return S.freq==30?addMonths(d,1):S.freq==15?(d.getDate()<15?new Date(d.getFullYear(),d.getMonth(),15,12):addMonths(new Date(d.getFullYear(),d.getMonth(),1,12),1)):addDays(d,S.freq)}
function paydays(n){const out=[];let d=nextPayday();for(let i=0;i<n;i++){out.push(d);d=stepPay(d)}return out}

// ---- bills ----
function step(b,d){return b.freq==="weekly"?addDays(d,7):b.freq==="biweekly"?addDays(d,14):b.freq==="monthly"?addMonths(d,1):b.freq==="yearly"?addMonths(d,12):null}
function back(b,d){return b.freq==="weekly"?addDays(d,-7):b.freq==="biweekly"?addDays(d,-14):b.freq==="monthly"?addMonths(d,-1):b.freq==="yearly"?addMonths(d,-12):today()}
function occurrences(b,until){
  const out=[];let d=D(b.due);
  while(step(b,d)&&d<today())d=step(b,d);           // roll recurring bills forward
  if(b.freq==="once"&&d<today())return out;
  while(d<=until){out.push(d);const n=step(b,d);if(!n)break;d=n}
  return out;
}

// For every upcoming bill, split it across the paychecks that come before it's due
// (since the previous time it was due). Bills due before the next check are "due now".
function forecast(n){
  const pds=paydays(n+30);const until=pds[pds.length-1];
  const set=new Array(pds.length).fill(0),detail=pds.map(()=>[]),parts=pds.map(()=>[]);let dueNow=[];
  S.bills.forEach(b=>{
    occurrences(b,until).forEach(due=>{
      const start=b.freq==="once"?today():back(b,due);
      const idx=pds.map((p,i)=>i).filter(i=>pds[i]<=due&&pds[i]>=addDays(start,-0.5));
      if(!idx.length){dueNow.push({b,due});return}
      const share=b.amt/idx.length;idx.forEach(i=>{set[i]+=share;parts[i].push({b,due,share,n:idx.length,pos:idx.indexOf(i)+1})});
      const last=idx[idx.length-1];
      detail[last].push({b,due});
    });
  });
  // bills due before the next paycheck must come from money he has now
  return pds.slice(0,n).map((p,i)=>({date:p,set:set[i],bills:detail[i],parts:parts[i]})).concat([]).map(x=>x).reduce((a,x)=>{a.rows.push(x);return a},{rows:[],dueNow});
}

function render(){
  const typ=typical(),low=lowCheck();
  const f=forecast(8);const rows=f.rows;
  const avg=rows.length?rows.slice(0,6).reduce((a,r)=>a+r.set,0)/Math.min(6,rows.length):0;
  $("perCheck").textContent=money(rows[0]?rows[0].set:0);
  let sub="";
  if(!S.bills.length&&!S.checks.length)sub="Add your paychecks and bills to get started.";
  else{
    sub=`from your ${fmt(rows[0].date)} check`;
    if(Math.abs(avg-rows[0].set)>5)sub+=` · about ${money(avg)} per check after that`;
    if(typ)sub+=` · leaves ~${money(Math.max(typ-rows[0].set,0))} to spend`;
  }
  $("heroSub").textContent=sub;
  explain(rows[0],typ,f.dueNow);

  let h="";
  if(f.dueNow.length){h+=`<div><div class="top warn"><span>Due before next payday</span><span>${money(f.dueNow.reduce((a,x)=>a+x.b.amt,0))}</span></div><div class="mut">${f.dueNow.map(x=>`${esc(x.b.name)} ${money(x.b.amt)} (${fmt(x.due)})`).join(" · ")} — pay from what you have now.</div></div>`}
  rows.forEach(r=>{
    const left=typ?typ-r.set:null;
    h+=`<div><div class="top"><span>${fmt(r.date)}</span><span>Save ${money(r.set)}</span></div>
      <div class="mut">${typ?`Expected check ~${money(typ)} · <span class="${left<0?"warn":""}">${left<0?"short "+money(-left):money(left)+" left to spend"}</span>`:"Add paychecks to see what's left"}</div>
      ${r.bills.length?`<div class="mut">Pays: ${r.bills.map(x=>`${esc(x.b.name)} ${money(x.b.amt)} on ${fmt(x.due)}`).join(" · ")}</div>`:""}</div>`;
  });
  if(!S.bills.length)h+=`<p class="mut">Tap “+ Add bill” to add your first bill.</p>`;
  if(typ&&low&&rows[0]&&low<rows[0].set)h+=`<p class="mut warn">Heads up: your smallest recent check (${money(low)}) wouldn't cover this. Try to keep a little extra saved.</p>`;
  $("fc").innerHTML=h;

  const fl={monthly:"monthly",weekly:"weekly",biweekly:"every 2 wks",yearly:"yearly",once:"one time"};
  $("bList").innerHTML=S.bills.length?S.bills.map(b=>{const n=occurrences(b,addMonths(today(),24))[0];return`<div><span>${esc(b.name)}<br><span class="mut">${fl[b.freq]}${n?" · next "+fmt(n):" · done"}</span></span><span class="r">${money(b.amt)} <button class="x" onclick="del('bills','${b.id}')">✕</button></span></div>`}).join(""):'<p class="mut">No bills yet.</p>';
  $("pList").innerHTML=S.checks.length?[...S.checks].sort((a,b)=>a.date<b.date?1:-1).map(c=>`<div><span>${fmt(D(c.date))}</span><span class="r">${money(c.amt)} <button class="x" onclick="del('checks','${c.id}')">✕</button></span></div>`).join(""):'<p class="mut">None yet.</p>';
  $("freq").value=S.freq;$("nextPay").value=iso(nextPayday());
  $("payNote").textContent=typ?`Typical check: ${money(typ)} (learned from your recent checks).`:"";
}
let undoT;function explain(r,typ,dueNow){
  const el=$("explain");
  if(!r||(!S.bills.length&&!S.checks.length)){el.innerHTML='<h2>Here\u2019s how it works</h2><p>1. Tap <b>+ Add bill</b> for each bill you pay.</p><p>2. Tap <b>+ Add paycheck</b> every time you get paid.</p><p>3. This box will tell you exactly what to set aside and what\u2019s yours to spend.</p>';return}
  const check=typ||0;
  const parts=[...r.parts].sort((a,b)=>a.due-b.due);
  let h=`<h2>Your ${fmt(r.date)} check, in plain English</h2>`;
  if(check)h+=`<p>You'll probably get about <b>${money(check)}</b>.</p>`;
  if(dueNow.length)h+=`<p class="warn">First: ${dueNow.map(x=>`${esc(x.b.name)} (${money(x.b.amt)}) is due ${fmt(x.due)}, before this check`).join("; ")}. Pay that from money you already have.</p>`;
  if(!parts.length)h+=`<p>Nothing needs to be saved from this check.</p>`;
  else{
    h+=`<p>Out of it, set this aside:</p>`;
    parts.forEach(p=>{
      const why=p.n===1?`pays the whole thing, due ${fmt(p.due)}`:`part ${p.pos} of ${p.n} toward ${money(p.b.amt)} due ${fmt(p.due)}`;
      h+=`<div class="ln"><span><b>${esc(p.b.name)}</b><br><span class="mut">${why}</span></span><span class="r"><b>${money(p.share)}</b></span></div>`;
    });
    h+=`<div class="ln"><span><b>Total to save</b></span><span class="r"><b>${money(r.set)}</b></span></div>`;
  }
  if(check){const left=check-r.set;
    h+=left>=0?`<p class="left">${money(left)} is yours to spend.</p><p class="mut">That's for gas, food, and everything else until your next check.</p>`
      :`<p class="left warn">You're ${money(-left)} short this check.</p><p class="mut">Save what you can now and catch up on the next one, or look for a bill you can push back.</p>`}
  else h+=`<p class="mut">Add a paycheck so I can tell you what's left to spend.</p>`;
  el.innerHTML=h;
}
function del(k,id){const it=S[k].find(x=>x.id===id);S[k]=S[k].filter(x=>x.id!==id);save();
  const t=$("toast");t.innerHTML=`Deleted ${esc(it.name||money(it.amt)+" check")} <button onclick="undoDel()">Undo</button>`;t.classList.remove("hide");window._undo=()=>{S[k].push(it);save()};clearTimeout(undoT);undoT=setTimeout(()=>t.classList.add("hide"),6000)}
function undoDel(){window._undo&&window._undo();window._undo=null;$("toast").classList.add("hide")}

$("pDate").value=iso(today());$("bDue").value=iso(today());
$("pAdd").onclick=()=>{const a=parseFloat($("pAmt").value);if(!a){$("pAmt").focus();return}const d=$("pDate").value||iso(today());S.checks.push({id:uid(),date:d,amt:a});
  // learn pay schedule from check dates
  const c=[...S.checks].sort((x,y)=>x.date<y.date?1:-1);
  if(c.length>=2){const g=(D(c[0].date)-D(c[1].date))/864e5;S.freq=g<=9?7:g<=14.5?14:g<=17?15:30}
  S.nextPay=iso(stepPay(D(c[0].date)));$("pAmt").value="";closeForms();save();window.scrollTo({top:0,behavior:"smooth"})};
$("bAdd").onclick=()=>{const n=$("bName").value.trim(),a=parseFloat($("bAmt").value);if(!n){$("bName").focus();return}if(!a){$("bAmt").focus();return}S.bills.push({id:uid(),name:n,amt:a,freq:$("bFreq").value,due:$("bDue").value||iso(today())});$("bName").value=$("bAmt").value="";closeForms();save();window.scrollTo({top:0,behavior:"smooth"})};
$("freq").onchange=e=>{S.freq=+e.target.value;save()};
$("nextPay").onchange=e=>{S.nextPay=e.target.value;save()};
function openForm(id){closeForms();$("pDate").value=iso(today());$(id).classList.remove("hide");$(id).scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>$(id).querySelector("input").focus(),300)}
function closeForms(){["pForm","bForm"].forEach(f=>$(f).classList.add("hide"))}
$("bkCopy").onclick=async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);$("bkArea").innerHTML='<p class="mut">Copied ✓ — paste it into a note or text yourself.</p>'}catch(e){$("bkArea").innerHTML='<textarea style="width:100%;height:80px">'+esc(t)+'</textarea>'}};
$("bkRest").onclick=()=>{$("bkArea").innerHTML='<textarea id="bkIn" style="width:100%;height:80px" placeholder="Paste backup here"></textarea><button id="bkGo">Restore</button>';$("bkGo").onclick=()=>{try{const d=JSON.parse($("bkIn").value);if(!Array.isArray(d.bills))throw 0;S={...S,...d};save();$("bkArea").innerHTML='<p class="mut">Restored ✓</p>'}catch(e){$("bkArea").innerHTML='<p class="mut warn">That doesn’t look like a backup.</p>'}}};
render();
</script>
</body>
</html>
